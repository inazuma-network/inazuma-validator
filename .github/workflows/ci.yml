name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh
      - name: no secrets echoed
        run: "! rg -n 'echo .*INAZ_KEY|echo .*SECRET' scripts/ || exit 1"
